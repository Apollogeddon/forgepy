name: Python Version

on:
  workflow_call:
    inputs:
      runs_on:
        description: "Runner label for every job, e.g. a self-hosted scale set's"
        required: false
        type: string
        default: 'ubuntu-latest'
      working_directory:
        required: false
        type: string
        default: '.'
    outputs:
      new_release_published:
        description: "Whether a new release was published"
        value: ${{ format('{0}', jobs.release-please.outputs.release_created == 'true' || jobs.release-please.outputs.release_created == true || jobs.release-please.outputs.releases_created == 'true' || jobs.release-please.outputs.releases_created == true) }}
      version:
        description: "Released version (e.g. 1.2.3); empty when nothing was released"
        value: ${{ jobs.release-please.outputs.version }}
      tag_name:
        description: "Released tag (e.g. v1.2.3); empty when nothing was released"
        value: ${{ jobs.release-please.outputs.tag_name }}

jobs:
  release-please:
    runs-on: ${{ inputs.runs_on }}
    timeout-minutes: 10
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      releases_created: ${{ steps.release.outputs.releases_created }}
      version: ${{ steps.release.outputs.version }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v5
        id: release
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          config-file: .github/release.json
          manifest-file: .github/.release.json
