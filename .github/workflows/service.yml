name: Python Service

on:
  workflow_call:
    inputs:
      runs_on:
        description: "Runner label for every job, e.g. a self-hosted scale set's"
        required: false
        type: string
        default: 'ubuntu-latest'
      enable_secrets:
        required: false
        type: boolean
        default: true
      python_version:
        required: false
        type: string
        default: '3.13'
      working_directory:
        required: false
        type: string
        default: '.'
      run_tests:
        required: false
        type: boolean
        default: true
      enable_versioning:
        required: false
        type: boolean
        default: true
    outputs:
      new_release_published:
        description: "Whether a new release was published"
        value: ${{ jobs.version.outputs.new_release_published }}
      version:
        description: "Released version (e.g. 1.2.3); empty when nothing was released"
        value: ${{ jobs.version.outputs.version }}
      tag_name:
        description: "Released tag (e.g. v1.2.3); empty when nothing was released"
        value: ${{ jobs.version.outputs.tag_name }}

jobs:
  auto-merge:
    uses: ./.github/workflows/merge.yml
    with:
      runs_on: ${{ inputs.runs_on }}
    needs: [testing]
    permissions:
      contents: write
      pull-requests: write

  testing:
    uses: ./.github/workflows/testing.yml
    with:
      runs_on: ${{ inputs.runs_on }}
      working_directory: ${{ inputs.working_directory }}
      python_version: ${{ inputs.python_version }}
      enable_secrets: ${{ inputs.enable_secrets }}
      run_tests: ${{ inputs.run_tests }}

  version:
    if: inputs.enable_versioning
    uses: ./.github/workflows/version.yml
    needs: [testing]
    with:
      runs_on: ${{ inputs.runs_on }}
      working_directory: ${{ inputs.working_directory }}
