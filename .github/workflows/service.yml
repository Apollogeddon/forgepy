name: service

# A service's checks: lint, scan, test and build. docker.yml and debian.yml package it.

on:
  workflow_call:
    inputs:
      runs_on:
        description: "Runner label for every job, e.g. a self-hosted scale set's"
        required: false
        type: string
        default: 'ubuntu-latest'
      working_directory:
        description: "Directory holding pyproject.toml"
        required: false
        type: string
        default: '.'
      python_version:
        description: "Python version; empty reads the project's .python-version, else Python 3.13"
        required: false
        type: string
        default: ''
      enable_secrets:
        description: "Scan for secrets with Gitleaks"
        required: false
        type: boolean
        default: true
      run_tests:
        description: "Run the test suite; init --no-testing sets it to false"
        required: false
        type: boolean
        default: true
      run_build:
        description: "Run the build stage; false for a project with nothing to build, as init --jython sets it"
        required: false
        type: boolean
        default: true
      sync_args:
        description: "Extra arguments for uv sync, e.g. --group to pick a dependency group"
        required: false
        type: string
        default: ''
      build_command:
        description: "The command that builds the project into working_directory/dist"
        required: false
        type: string
        default: 'uv build'
      artifact_name:
        description: "The build artifact's name; a matrix gives each leg its own"
        required: false
        type: string
        default: 'dist'
      ref:
        description: "Commit, branch or tag to check out; empty means the commit that triggered the run"
        required: false
        type: string
        default: ''
      pre_build_command:
        description: "Shell command run in working_directory before installing dependencies, in every job that does; GH_TOKEN holds the GH_TOKEN secret if passed"
        required: false
        type: string
        default: ''
      test_windows:
        description: "Test on Windows too: a runner label, or a JSON object {\"runs_on\", \"env\"} whose env is set for the tests, e.g. {\"runs_on\": \"windows-latest\", \"env\": {\"PYTHONUTF8\": \"1\"}}; empty skips it"
        required: false
        type: string
        default: ''
      test_macos:
        description: "Test on macOS too: a runner label, or a JSON object {\"runs_on\", \"env\"} whose env is set for the tests; empty skips it"
        required: false
        type: string
        default: ''
      test_versions:
        description: "Test on these Python versions too, on Linux: a JSON array, e.g. '[\"3.11\", \"3.12\"]'; empty skips it"
        required: false
        type: string
        default: ''
    secrets:
      GH_TOKEN:
        description: "A token pre_build_command can use, as GH_TOKEN"
        required: false

# nothing by default: every job asks for what it needs
permissions: {}

jobs:
  lint:
    name: lint
    runs-on: ${{ inputs.runs_on }}
    timeout-minutes: 10
    permissions:
      contents: read
    defaults:
      run:
        working-directory: ${{ inputs.working_directory }}
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - name: Set up uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          enable-cache: true
      # the input if set, else the project's .python-version, else forgepy's default
      - name: Resolve the Python version
        id: python
        env:
          INPUT: ${{ inputs.python_version }}
        run: |
          if [ -n "$INPUT" ]; then version="$INPUT"
          elif [ -f .python-version ]; then version=$(tr -d '[:space:]' < .python-version)
          else version=3.13
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ steps.python.outputs.version }}
      # generates what the install, checks or build need, e.g. content made by another tool
      - name: Run the pre-build command
        if: inputs.pre_build_command != ''
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          PRE_BUILD_COMMAND: ${{ inputs.pre_build_command }}
        run: bash -e -c "$PRE_BUILD_COMMAND"
      - name: Install dependencies
        env:
          SYNC_ARGS: ${{ inputs.sync_args }}
        run: |
          # unquoted on purpose: it can hold several arguments
          # shellcheck disable=SC2086
          uv sync --locked $SYNC_ARGS
      - name: Lint
        run: uv run ruff check .
      - name: Check formatting
        run: uv run ruff format --check .
      - name: Check types
        run: uv run basedpyright
      # a --jython project's scripts must stay valid Jython 2.7
      - name: Check Jython 2.7 compatibility
        if: hashFiles(format('{0}/.forgepy/ruff-jython.toml', inputs.working_directory)) != ''
        run: uv run poe compat
      - name: Check forgepy's configs
        if: hashFiles(format('{0}/.forgepy/**', inputs.working_directory)) != ''
        run: uv run forgepy sync --check

  scan:
    name: scan
    runs-on: ${{ inputs.runs_on }}
    timeout-minutes: 10
    permissions:
      contents: read
      # Gitleaks comments on the pull request it finds a secret in
      pull-requests: write
    defaults:
      run:
        working-directory: ${{ inputs.working_directory }}
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
          fetch-depth: 0
      - name: Scan with Gitleaks
        if: inputs.enable_secrets
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # the vulnerabilities and licences a pull request's dependency changes bring in; private repositories
      # need GitHub Code Security for it
      - name: Review the dependency changes
        if: github.event_name == 'pull_request' && github.event.repository.private == false
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
      # a pinned release, checked against the checksums it was published with
      - name: Install OSV-Scanner
        env:
          OSV_SCANNER_VERSION: v2.7.0
          ARCH: ${{ runner.arch }}
        run: |
          case "$ARCH" in
            X64) arch=amd64 ;;
            ARM64) arch=arm64 ;;
            *) echo "::error::OSV-Scanner has no Linux build for $ARCH"; exit 1 ;;
          esac
          dir="$RUNNER_TEMP/osv-scanner"
          mkdir -p "$dir"
          cd "$dir"
          base="https://github.com/google/osv-scanner/releases/download/$OSV_SCANNER_VERSION"
          curl -fsSLO "$base/osv-scanner_linux_$arch"
          curl -fsSLO "$base/osv-scanner_SHA256SUMS"
          sha256sum -c --ignore-missing osv-scanner_SHA256SUMS
          mv "osv-scanner_linux_$arch" osv-scanner
          chmod +x osv-scanner
      # A high or critical finding (CVSS 7 or more) fails a pull request; elsewhere it's annotated
      # instead, so releases still run while a Dependabot security update proposes the fix. Accept one
      # with an IgnoredVulns entry in an osv-scanner.toml beside the lockfile
      - name: Scan with OSV
        id: osv
        run: |
          # 0: nothing found, 1: vulnerabilities found, 128: no lockfile, anything else: no scan
          status=0
          "$RUNNER_TEMP/osv-scanner/osv-scanner" scan source -r --format json --output-file "$RUNNER_TEMP/osv.json" . || status=$?
          echo "status=$status" >> "$GITHUB_OUTPUT"
          rm -rf "$RUNNER_TEMP/osv-scanner"
      - name: Report OSV findings
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          OSV_STATUS: ${{ steps.osv.outputs.status }}
          OSV_REPORT: ${{ runner.temp }}/osv.json
          OSV_ENFORCE: ${{ github.event_name == 'pull_request' }}
        with:
          script: |
            const fs = require('node:fs');
            const path = require('node:path');
            const status = Number(process.env.OSV_STATUS);
            if (status === 128) {
              core.info('No lockfiles to scan');
              return;
            }
            if ((status !== 0 && status !== 1) || !fs.existsSync(process.env.OSV_REPORT)) {
              // a pull request mustn't pass unchecked; elsewhere an unreachable OSV API shouldn't stop a release
              const message = `OSV-Scanner couldn't finish (exit ${status}), so dependencies weren't checked; see the scan step's log`;
              if (process.env.OSV_ENFORCE === 'true') core.setFailed(message);
              else core.warning(message, { title: 'OSV scan incomplete' });
              return;
            }
            const report = JSON.parse(fs.readFileSync(process.env.OSV_REPORT, 'utf8'));
            // a GitHub advisory's rating when an advisory has no CVSS score
            const ratings = { CRITICAL: 9, HIGH: 7, MODERATE: 4, MEDIUM: 4, LOW: 1 };
            const rows = [];
            let blocking = 0;
            for (const result of report.results ?? []) {
              const file = path.relative(process.env.GITHUB_WORKSPACE, result.source.path);
              for (const { package: pkg, vulnerabilities = [], groups = [] } of result.packages ?? []) {
                for (const group of groups) {
                  const vulns = vulnerabilities.filter((v) => group.ids.includes(v.id));
                  let score = Number.parseFloat(group.max_severity);
                  if (Number.isNaN(score)) {
                    score = Math.max(0, ...vulns.map((v) => ratings[String(v.database_specific?.severity).toUpperCase()] ?? 0));
                  }
                  const high = score >= 7;
                  const message = `${pkg.name} ${pkg.version}: ${group.ids.join(', ')} ${vulns[0]?.summary ?? ''} (severity ${score || 'unknown'})`;
                  if (high) {
                    blocking++;
                    core.error(message, { title: 'High or critical vulnerability', file });
                  } else {
                    core.warning(message, { title: 'Vulnerability', file });
                  }
                  rows.push([file, `${pkg.name} ${pkg.version}`, group.ids.join(', '), String(score || 'unknown')]);
                }
              }
            }
            if (rows.length) {
              await core.summary
                .addHeading('OSV-Scanner findings', 3)
                .addTable([['Lockfile', 'Package', 'Advisories', 'Severity'], ...rows])
                .write();
            }
            const found = `${blocking} high or critical ${blocking === 1 ? 'vulnerability' : 'vulnerabilities'}`;
            if (blocking && process.env.OSV_ENFORCE === 'true') {
              core.setFailed(`${found}: update the packages, or record an accepted one in osv-scanner.toml`);
            } else if (blocking) {
              core.warning(`${found}: this fails pull requests until they're updated, as a Dependabot security update may do`, { title: 'OSV scan' });
            } else {
              core.info(`${rows.length} found, none high or critical`);
            }

  test:
    name: test
    if: inputs.run_tests
    needs: [lint, scan]
    runs-on: ${{ inputs.runs_on }}
    timeout-minutes: 10
    permissions:
      contents: read
    defaults:
      run:
        working-directory: ${{ inputs.working_directory }}
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - name: Set up uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          enable-cache: true
      # the input if set, else the project's .python-version, else forgepy's default
      - name: Resolve the Python version
        id: python
        env:
          INPUT: ${{ inputs.python_version }}
        run: |
          if [ -n "$INPUT" ]; then version="$INPUT"
          elif [ -f .python-version ]; then version=$(tr -d '[:space:]' < .python-version)
          else version=3.13
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ steps.python.outputs.version }}
      # generates what the install, checks or build need, e.g. content made by another tool
      - name: Run the pre-build command
        if: inputs.pre_build_command != ''
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          PRE_BUILD_COMMAND: ${{ inputs.pre_build_command }}
        run: bash -e -c "$PRE_BUILD_COMMAND"
      - name: Install dependencies
        env:
          SYNC_ARGS: ${{ inputs.sync_args }}
        run: |
          # unquoted on purpose: it can hold several arguments
          # shellcheck disable=SC2086
          uv sync --locked $SYNC_ARGS
      - name: Test
        run: uv run pytest
      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-${{ inputs.artifact_name }}
          path: |
            ${{ inputs.working_directory }}/htmlcov
            ${{ inputs.working_directory }}/junit-report.xml
          if-no-files-found: ignore

  # the tests only, without coverage: the Linux stage reports it
  test-windows:
    name: test (windows)
    if: inputs.run_tests && inputs.test_windows != ''
    needs: [lint, scan]
    runs-on: ${{ startsWith(inputs.test_windows, '{') && (fromJSON(inputs.test_windows).runs_on || 'windows-latest') || inputs.test_windows }}
    timeout-minutes: 20
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
        working-directory: ${{ inputs.working_directory }}
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - name: Set up uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          enable-cache: true
      # the input if set, else the project's .python-version, else forgepy's default
      - name: Resolve the Python version
        id: python
        env:
          INPUT: ${{ inputs.python_version }}
        run: |
          if [ -n "$INPUT" ]; then version="$INPUT"
          elif [ -f .python-version ]; then version=$(tr -d '[:space:]' < .python-version)
          else version=3.13
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ steps.python.outputs.version }}
      - name: Set the runner's environment
        if: startsWith(inputs.test_windows, '{')
        env:
          TARGET: ${{ inputs.test_windows }}
        run: jq -r '(.env // {}) | to_entries[] | "\(.key)=\(.value)"' <<< "$TARGET" >> "$GITHUB_ENV"
      # generates what the install, checks or build need, e.g. content made by another tool
      - name: Run the pre-build command
        if: inputs.pre_build_command != ''
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          PRE_BUILD_COMMAND: ${{ inputs.pre_build_command }}
        run: bash -e -c "$PRE_BUILD_COMMAND"
      - name: Install dependencies
        env:
          SYNC_ARGS: ${{ inputs.sync_args }}
        run: |
          # unquoted on purpose: it can hold several arguments
          # shellcheck disable=SC2086
          uv sync --locked $SYNC_ARGS
      - name: Test
        run: uv run pytest

  # the tests only, without coverage: the Linux stage reports it
  test-macos:
    name: test (macos)
    if: inputs.run_tests && inputs.test_macos != ''
    needs: [lint, scan]
    runs-on: ${{ startsWith(inputs.test_macos, '{') && (fromJSON(inputs.test_macos).runs_on || 'macos-latest') || inputs.test_macos }}
    timeout-minutes: 20
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
        working-directory: ${{ inputs.working_directory }}
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - name: Set up uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          enable-cache: true
      # the input if set, else the project's .python-version, else forgepy's default
      - name: Resolve the Python version
        id: python
        env:
          INPUT: ${{ inputs.python_version }}
        run: |
          if [ -n "$INPUT" ]; then version="$INPUT"
          elif [ -f .python-version ]; then version=$(tr -d '[:space:]' < .python-version)
          else version=3.13
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ steps.python.outputs.version }}
      - name: Set the runner's environment
        if: startsWith(inputs.test_macos, '{')
        env:
          TARGET: ${{ inputs.test_macos }}
        run: jq -r '(.env // {}) | to_entries[] | "\(.key)=\(.value)"' <<< "$TARGET" >> "$GITHUB_ENV"
      # generates what the install, checks or build need, e.g. content made by another tool
      - name: Run the pre-build command
        if: inputs.pre_build_command != ''
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          PRE_BUILD_COMMAND: ${{ inputs.pre_build_command }}
        run: bash -e -c "$PRE_BUILD_COMMAND"
      - name: Install dependencies
        env:
          SYNC_ARGS: ${{ inputs.sync_args }}
        run: |
          # unquoted on purpose: it can hold several arguments
          # shellcheck disable=SC2086
          uv sync --locked $SYNC_ARGS
      - name: Test
        run: uv run pytest

  # the tests only, without coverage, on each Python version the project supports besides its own
  test-versions:
    name: test (${{ matrix.version }})
    if: inputs.run_tests && inputs.test_versions != ''
    needs: [lint, scan]
    runs-on: ${{ inputs.runs_on }}
    timeout-minutes: 10
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(inputs.test_versions || '[]') }}
    defaults:
      run:
        working-directory: ${{ inputs.working_directory }}
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - name: Set up uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          enable-cache: true
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.version }}
      # generates what the install, checks or build need, e.g. content made by another tool
      - name: Run the pre-build command
        if: inputs.pre_build_command != ''
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          PRE_BUILD_COMMAND: ${{ inputs.pre_build_command }}
        run: bash -e -c "$PRE_BUILD_COMMAND"
      # --python over the project's .python-version; not UV_PYTHON, which would reach the uv the tests run too
      - name: Install dependencies
        env:
          SYNC_ARGS: ${{ inputs.sync_args }}
          VERSION: ${{ matrix.version }}
        run: |
          # unquoted on purpose: it can hold several arguments
          # shellcheck disable=SC2086
          uv sync --locked --python "$VERSION" $SYNC_ARGS
      # the environment's own Python, as uv run would replace an environment .python-version doesn't match
      - name: Test
        run: .venv/bin/python -m pytest

  build:
    name: build
    if: inputs.run_build
    # only needs the lint and scan to pass, so it runs alongside the tests
    needs: [lint, scan]
    runs-on: ${{ inputs.runs_on }}
    timeout-minutes: 10
    permissions:
      contents: read
    defaults:
      run:
        working-directory: ${{ inputs.working_directory }}
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - name: Set up uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          enable-cache: true
      # the input if set, else the project's .python-version, else forgepy's default
      - name: Resolve the Python version
        id: python
        env:
          INPUT: ${{ inputs.python_version }}
        run: |
          if [ -n "$INPUT" ]; then version="$INPUT"
          elif [ -f .python-version ]; then version=$(tr -d '[:space:]' < .python-version)
          else version=3.13
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ steps.python.outputs.version }}
      # generates what the install, checks or build need, e.g. content made by another tool
      - name: Run the pre-build command
        if: inputs.pre_build_command != ''
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          PRE_BUILD_COMMAND: ${{ inputs.pre_build_command }}
        run: bash -e -c "$PRE_BUILD_COMMAND"
      - name: Install dependencies
        env:
          SYNC_ARGS: ${{ inputs.sync_args }}
        run: |
          # unquoted on purpose: it can hold several arguments
          # shellcheck disable=SC2086
          uv sync --locked $SYNC_ARGS
      - name: Build
        env:
          BUILD_COMMAND: ${{ inputs.build_command }}
        run: bash -e -c "$BUILD_COMMAND"
      - name: Upload the build
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ inputs.artifact_name }}
          path: ${{ inputs.working_directory }}/dist
