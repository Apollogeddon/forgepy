name: Python Quality

on:
  workflow_call:
    inputs:
      runs_on:
        description: "Runner label for every job, e.g. a self-hosted scale set's"
        required: false
        type: string
        default: 'ubuntu-latest'
      working_directory:
        required: false
        type: string
        default: '.'
      python_version:
        required: false
        type: string
        description: "Python version; empty reads the project's .python-version, else Python 3.13"
        default: ''
      enable_secrets:
        required: false
        type: boolean
        default: true
      sync_args:
        description: "Extra arguments for uv sync, e.g. --group to pick a dependency group"
        required: false
        type: string
        default: ''
      ref:
        description: "Commit, branch or tag to check out; empty means the commit that triggered the run"
        required: false
        type: string
        default: ''
      pre_build_command:
        description: "Shell command run in working_directory before installing dependencies, in every job that does; GH_TOKEN holds the GH_TOKEN secret if passed"
        required: false
        type: string
        default: ''
    secrets:
      GH_TOKEN:
        description: "A token pre_build_command can use, as GH_TOKEN"
        required: false

jobs:
  secure:
    runs-on: ${{ inputs.runs_on }}
    timeout-minutes: 10
    defaults:
      run:
        working-directory: ${{ inputs.working_directory }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
          fetch-depth: 0
      - name: Gitleaks Scan
        if: inputs.enable_secrets
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: OSV Scan
        run: |
          curl -sL https://github.com/google/osv-scanner/releases/latest/download/osv-scanner_linux_amd64 -o osv-scanner
          chmod +x osv-scanner
          ./osv-scanner scan source -r . || true
          rm osv-scanner

  linting:
    runs-on: ${{ inputs.runs_on }}
    timeout-minutes: 10
    defaults:
      run:
        working-directory: ${{ inputs.working_directory }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      # the input if set, else the project's .python-version, else forgepy's default
      - name: Resolve the Python version
        id: python
        working-directory: ${{ inputs.working_directory }}
        env:
          INPUT: ${{ inputs.python_version }}
        run: |
          if [ -n "$INPUT" ]; then version="$INPUT"
          elif [ -f .python-version ]; then version=$(tr -d '[:space:]' < .python-version)
          else version=3.13
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ steps.python.outputs.version }}
      # generates what the install, checks or build need, e.g. content made by another tool
      - name: Pre-build command
        if: inputs.pre_build_command != ''
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          PRE_BUILD_COMMAND: ${{ inputs.pre_build_command }}
        run: bash -e -c "$PRE_BUILD_COMMAND"
      - name: Install dependencies
        # unquoted on purpose: it can hold several arguments
        run: uv sync --locked $SYNC_ARGS
        env:
          SYNC_ARGS: ${{ inputs.sync_args }}
      - name: Ruff Lint
        run: uv run ruff check .
      - name: Ruff Format Check
        run: uv run ruff format --check .
      - name: Type Check
        run: uv run basedpyright
      # a --jython project's scripts must stay valid Jython 2.7
      - name: Jython 2.7 Compatibility
        if: hashFiles(format('{0}/.forgepy/ruff-jython.toml', inputs.working_directory)) != ''
        run: uv run poe compat
      - name: Check forgepy config drift
        if: hashFiles(format('{0}/.forgepy/**', inputs.working_directory)) != ''
        run: uv run forgepy sync --check
