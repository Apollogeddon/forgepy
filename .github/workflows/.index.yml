name: ForgePy CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # never cancel a run on main mid-release, or the release is created but never published
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  index:
    uses: ./.github/workflows/library.yml
    with:
      python_version: '3.13'
      working_directory: '.'
      publish: false
    permissions:
      contents: write
      pull-requests: write
      id-token: write
