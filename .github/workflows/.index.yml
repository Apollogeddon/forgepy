name: ForgePy CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # never cancel a run on main mid-release, or the release is created but never published
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # Which pipelines this change needs: the tool's runs unless only docs/ changed, and the
  # docs site's runs when docs/ or anything it builds from changed.
  changes:
    runs-on: ${{ github.event.repository.private && 'xerus' || 'ubuntu-latest' }}
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      code: ${{ steps.diff.outputs.code }}
      docs: ${{ steps.diff.outputs.docs }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Find what changed
        id: diff
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          # the site's sync check runs this package
          DOCS_INPUTS: '^(docs/|\.github/|src/forgepy/|pyproject\.toml$)'
        run: |
          # a manual run, a new branch or a rewritten history has no base to compare with
          if [ "$EVENT" = workflow_dispatch ] || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            echo "code=true" >> "$GITHUB_OUTPUT"
            echo "docs=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          files=$(git diff --name-only "$BASE" HEAD)
          printf '%s\n' "$files"
          if printf '%s\n' "$files" | grep -qv '^docs/'; then code=true; else code=false; fi
          if printf '%s\n' "$files" | grep -qE "$DOCS_INPUTS"; then docs=true; else docs=false; fi
          echo "code=$code" | tee -a "$GITHUB_OUTPUT"
          echo "docs=$docs" | tee -a "$GITHUB_OUTPUT"

  index:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    uses: ./.github/workflows/library.yml
    with:
      # the PR run tested this change; release-testing re-tests main before a release
      test_on_push: false
      # a release PR only bumps the version and changelog
      test_release_prs: false
      # The self-hosted `xerus` runners; a public repository never uses them.
      runs_on: ${{ github.event.repository.private && 'xerus' || 'ubuntu-latest' }}
      working_directory: '.'
      publish: false
    permissions:
      contents: write
      pull-requests: write
      id-token: write

  pages:
    needs: changes
    if: needs.changes.outputs.docs == 'true'
    uses: ./.github/workflows/website.yml
    with:
      test_release_prs: false
      runs_on: ${{ github.event.repository.private && 'xerus' || 'ubuntu-latest' }}
      working_directory: 'docs'
      build_command: 'uv run zensical build --strict'
      enable_secrets: false
      run_tests: false
      enable_versioning: false
      # the tool's pipeline auto-merges Dependabot PRs; this one does when only docs/ changed
      auto_merge: ${{ needs.changes.outputs.code != 'true' }}
      # distinct from the library job's 'dist' artifact in the same run
      artifact_name: 'pages-dist'
    permissions:
      contents: write
      id-token: write
      pages: write
      pull-requests: write
