name: index

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:
  # sent by the merge pipeline, as a merge it makes starts no push run on main
  repository_dispatch:
    types: [auto-merged]
  # weekly, for the patch pipeline, which a manual run and a Dependabot merge start too, and the Scorecard
  schedule:
    - cron: '17 3 * * 1'

concurrency:
  # a pull request's newer run replaces its older one; every other run has a group of its own, so a run on
  # main, running or queued, is never cancelled and a release is never created without being published
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

# nothing by default: each job grants what it needs
permissions: {}

# Each job calls one pipeline, so the run page reads <pipeline> / <stage>. Pull requests run the checks
# (library for the tool, website for docs/); main runs version, and on a release checks the tool again.
# forgepy isn't on PyPI, so nothing is published; the site deploys from every change to main that touches it.
# The self-hosted `xerus` runners serve a private repository; a public one never uses them.

jobs:
  # Which pipelines this change needs: the tool's runs unless only docs/ changed, and the
  # docs site's runs when docs/ or anything it builds from changed.
  changes:
    name: changes
    # the weekly run only patches
    if: github.event_name != 'schedule'
    runs-on: ${{ github.event.repository.private && 'xerus' || 'ubuntu-latest' }}
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      code: ${{ steps.diff.outputs.code }}
      docs: ${{ steps.diff.outputs.docs }}
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Find what changed
        id: diff
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          # the site's sync check runs this package
          DOCS_INPUTS: '^(docs/|\.github/|src/forgepy/|pyproject\.toml$)'
        run: |
          # a manual or dispatched run, a new branch or a rewritten history has no base to compare with
          if [ "$EVENT" = workflow_dispatch ] || [ "$EVENT" = repository_dispatch ] || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            echo "code=true" >> "$GITHUB_OUTPUT"
            echo "docs=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          files=$(git diff --name-only "$BASE" HEAD)
          printf '%s\n' "$files"
          if printf '%s\n' "$files" | grep -qv '^docs/'; then code=true; else code=false; fi
          if printf '%s\n' "$files" | grep -qE "$DOCS_INPUTS"; then docs=true; else docs=false; fi
          echo "code=$code" | tee -a "$GITHUB_OUTPUT"
          echo "docs=$docs" | tee -a "$GITHUB_OUTPUT"

  # OpenSSF Scorecard's checks of this repository's supply chain, as code scanning alerts; it only scores a
  # public repository. Not a pipeline: it's for this repository, not the projects forgepy generates
  scorecard:
    name: scorecard
    if: >-
      github.event.repository.private == false && github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'schedule')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      # the results, as code scanning alerts
      security-events: write
      # scorecard reads the repository's workflow runs
      actions: read
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Score
        uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          # publishing to the OpenSSF API needs id-token: write, and a badge isn't worth it
          publish_results: false
      - name: Upload the results
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: results.sarif

  version:
    needs: changes
    if: needs.changes.outputs.code == 'true' && github.event_name != 'pull_request'
    uses: ./.github/workflows/version.yml
    with:
      runs_on: ${{ github.event.repository.private && 'xerus' || 'ubuntu-latest' }}
      # both empty unless set, so release-please uses GITHUB_TOKEN
      app_client_id: ${{ vars.RELEASE_APP_CLIENT_ID }}
    secrets:
      APP_PRIVATE_KEY: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
    permissions:
      contents: write
      pull-requests: write

  # a pull request's checks, release-please's included, and on main the release's
  library:
    needs: [changes, version]
    if: >-
      !cancelled() && needs.changes.outputs.code == 'true' &&
      (github.event_name == 'pull_request' || needs.version.outputs.new_release_published == 'true')
    uses: ./.github/workflows/library.yml
    with:
      runs_on: ${{ github.event.repository.private && 'xerus' || 'ubuntu-latest' }}
      # init scaffolds on every platform, and requires-python is >=3.11 while .python-version is 3.13
      test_windows: windows-latest
      test_macos: macos-latest
      test_versions: '["3.11", "3.12"]'
    permissions:
      contents: read
      pull-requests: write

  # the docs site isn't versioned, so it's checked on every change that touches it, and deployed from main
  website:
    needs: changes
    if: needs.changes.outputs.docs == 'true'
    uses: ./.github/workflows/website.yml
    with:
      runs_on: ${{ github.event.repository.private && 'xerus' || 'ubuntu-latest' }}
      working_directory: 'docs'
      build_command: 'uv run zensical build --strict'
      enable_secrets: false
      run_tests: false
      # the site's internal links and WCAG 2.2 AA; it's served under /forgepy/ on GitHub Pages
      check_links: true
      check_accessibility: true
      base_path: '/forgepy/'
      # distinct from the library's 'dist' artifact in the same run
      artifact_name: 'pages-dist'
    permissions:
      contents: read
      pull-requests: write

  # GitHub Pages needs a public repository on a free plan; a paid plan can drop the visibility check
  pages:
    needs: website
    if: >-
      github.ref == 'refs/heads/main' && github.event_name != 'pull_request' &&
      github.event.repository.private == false
    uses: ./.github/workflows/pages.yml
    with:
      runs_on: ${{ github.event.repository.private && 'xerus' || 'ubuntu-latest' }}
      artifact_name: 'pages-dist'
    permissions:
      pages: write
      id-token: write

  # the docs site's forgepy files refreshed through a pull request; the tool has none of its own to refresh
  patch-docs:
    name: patch (docs)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || github.event_name == 'repository_dispatch'
    uses: ./.github/workflows/patch.yml
    with:
      runs_on: ${{ github.event.repository.private && 'xerus' || 'ubuntu-latest' }}
      working_directory: 'docs'
    permissions:
      contents: write
      pull-requests: write

  # Dependabot's pull requests: a review request, and a squash merge when the checks passed
  merge:
    needs: [changes, library, website]
    if: >-
      !cancelled() && github.event_name == 'pull_request' &&
      github.event.pull_request.user.login == 'dependabot[bot]'
    uses: ./.github/workflows/merge.yml
    with:
      runs_on: ${{ github.event.repository.private && 'xerus' || 'ubuntu-latest' }}
      checks_passed: ${{ !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled') }}
    permissions:
      contents: write
      pull-requests: write
