name: debian

# Packages a service as a .deb with nfpm, built against Debian's own Python, and checks the package.

on:
  workflow_call:
    inputs:
      runs_on:
        description: "Runner label for the test stage; the build stage is a container job, which needs GitHub's runners"
        required: false
        type: string
        default: 'ubuntu-latest'
      working_directory:
        description: "Directory holding pyproject.toml and nfpm.yaml"
        required: false
        type: string
        default: '.'
    outputs:
      package_artifact:
        description: "The artifact holding the .deb, for publish.yml's assets"
        value: debian-package

jobs:
  build:
    name: build
    # A container job, which self-hosted runners without a Docker daemon can't run.
    runs-on: ubuntu-latest
    # Build inside an actual Debian container so the venv is built against the same
    # apt-provided /usr/bin/python3 that the package's python3 dependency guarantees on
    # the real install target - a GitHub-hosted Python (setup-python, or uv's own
    # managed download) lives at a path no .deb dependency can promise exists there.
    # Its python3 (3.13 on trixie) must meet requires-python: forgepy refuses --debian above it.
    container: debian:trixie-slim
    timeout-minutes: 10
    permissions:
      contents: read
    defaults:
      run:
        working-directory: ${{ inputs.working_directory }}
    steps:
      - name: Check out
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install the build tools
        run: |
          apt-get update
          apt-get install -y --no-install-recommends curl ca-certificates python3 python3-venv
      # as every other job installs it; the action checks the download's checksum
      - name: Set up uv
        uses: astral-sh/setup-uv@v7
      - name: Install dependencies
        # overrides .python-version, whose patch pin the system Python may not match
        env:
          UV_PYTHON: /usr/bin/python3
        run: |
          uv venv --relocatable --no-managed-python .venv
          uv sync --locked --no-dev --no-editable
      # pinned and checked, as it builds the package users install; raise the two together
      - name: Install nfpm
        env:
          NFPM_VERSION: 2.47.0
          NFPM_SHA256: 3f1cf344bd0b57373ca55636a78c08b0491f7293d609a456a9ac3b0b150fda97
        run: |
          curl -fsSL "https://github.com/goreleaser/nfpm/releases/download/v${NFPM_VERSION}/nfpm_${NFPM_VERSION}_amd64.deb" -o "$RUNNER_TEMP/nfpm.deb"
          echo "${NFPM_SHA256}  $RUNNER_TEMP/nfpm.deb" | sha256sum -c -
          apt-get install -y "$RUNNER_TEMP/nfpm.deb"
          rm "$RUNNER_TEMP/nfpm.deb"
      - name: Build
        run: python3 packaging/build_deb.py
      - name: Upload the package
        uses: actions/upload-artifact@v7
        with:
          name: debian-package
          path: ${{ inputs.working_directory }}/*.deb
          if-no-files-found: error

  # the archive reads back with its control fields and files, so a broken package fails before it ships
  test:
    name: test
    needs: [build]
    runs-on: ${{ inputs.runs_on }}
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Download the package
        uses: actions/download-artifact@v8
        with:
          name: debian-package
          path: ${{ runner.temp }}/deb
      - name: Test
        working-directory: ${{ runner.temp }}/deb
        run: |
          for deb in *.deb; do
            dpkg-deb --info "$deb"
            dpkg-deb --contents "$deb" > /dev/null
            for field in Package Version Architecture; do
              [ -n "$(dpkg-deb --field "$deb" "$field")" ] || { echo "::error::$deb has no $field"; exit 1; }
            done
          done
