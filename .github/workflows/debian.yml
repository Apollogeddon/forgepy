name: Python Debian

on:
  workflow_call:
    inputs:
      enable_secrets:
        required: false
        type: boolean
        default: true
      python_version:
        required: false
        type: string
        default: '3.13'
      working_directory:
        required: false
        type: string
        default: '.'
      docker:
        required: false
        type: boolean
        default: false
      docker_platforms:
        required: false
        type: string
        default: 'linux/amd64,linux/arm64'
      docker_native_arm:
        required: false
        type: boolean
        default: true

jobs:
  auto-merge:
    uses: ./.github/workflows/merge.yml
    needs: [testing, docker]
    # docker is skipped when disabled, and a plain `needs` on a skipped job would skip auto-merge too
    if: ${{ !cancelled() && needs.testing.result == 'success' && (needs.docker.result == 'success' || needs.docker.result == 'skipped') }}
    permissions:
      contents: write
      pull-requests: write

  testing:
    uses: ./.github/workflows/testing.yml
    with:
      working_directory: ${{ inputs.working_directory }}
      python_version: ${{ inputs.python_version }}
      enable_secrets: ${{ inputs.enable_secrets }}

  version:
    uses: ./.github/workflows/version.yml
    needs: [testing]
    with:
      working_directory: ${{ inputs.working_directory }}

  build-deb:
    runs-on: ubuntu-latest
    # Build inside an actual Debian container so the venv is built against the same
    # apt-provided /usr/bin/python3 that `depends: python3 (>= X.Y)` guarantees on
    # the real install target - a GitHub-hosted Python (setup-python, or uv's own
    # managed download) lives at a path no .deb dependency can promise exists there.
    container: debian:bookworm-slim
    timeout-minutes: 10
    needs: [version]
    if: github.ref == 'refs/heads/main' && (needs.version.outputs.new_release_published == 'true' || needs.version.outputs.new_release_published == true)
    permissions:
      contents: write
    defaults:
      run:
        working-directory: ${{ inputs.working_directory }}
    steps:
      - uses: actions/checkout@v7
      - name: Install build tooling
        run: |
          apt-get update
          apt-get install -y --no-install-recommends curl ca-certificates python3 python3-venv
      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Build a venv against the system Python
        run: |
          uv venv --relocatable --no-managed-python .venv
          uv sync --locked --no-dev --no-editable
      - name: Install nfpm
        run: |
          curl -sL https://github.com/goreleaser/nfpm/releases/latest/download/nfpm_amd64.deb -o nfpm.deb
          apt-get install -y ./nfpm.deb
          rm nfpm.deb
      - name: Build .deb package
        run: python3 packaging/build_deb.py
      - name: Upload .deb Artifact
        uses: actions/upload-artifact@v7
        with:
          name: deb-package
          path: ${{ inputs.working_directory }}/*.deb

  docker:
    needs: [testing, version]
    # !cancelled() so a skipped version job (PRs, enable_versioning: false) doesn't skip the build
    if: ${{ !cancelled() && inputs.docker && needs.testing.result == 'success' && (needs.version.result == 'success' || needs.version.result == 'skipped') }}
    uses: ./.github/workflows/docker.yml
    with:
      working_directory: ${{ inputs.working_directory }}
      platforms: ${{ inputs.docker_platforms }}
      native_arm: ${{ inputs.docker_native_arm }}
      push: ${{ github.ref == 'refs/heads/main' && needs.version.outputs.new_release_published == 'true' }}
      version: ${{ needs.version.outputs.version }}
