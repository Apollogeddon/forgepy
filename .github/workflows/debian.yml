name: Python Debian

on:
  workflow_call:
    inputs:
      enable_secrets:
        required: false
        type: boolean
        default: true
      python_version:
        required: false
        type: string
        default: '3.13'
      working_directory:
        required: false
        type: string
        default: '.'
      run_tests:
        required: false
        type: boolean
        default: true
      enable_versioning:
        required: false
        type: boolean
        default: true
    outputs:
      new_release_published:
        description: "Whether a new release was published"
        value: ${{ jobs.version.outputs.new_release_published }}
      version:
        description: "Released version (e.g. 1.2.3); empty when nothing was released"
        value: ${{ jobs.version.outputs.version }}
      tag_name:
        description: "Released tag (e.g. v1.2.3); empty when nothing was released"
        value: ${{ jobs.version.outputs.tag_name }}

jobs:
  auto-merge:
    uses: ./.github/workflows/merge.yml
    needs: [testing]
    permissions:
      contents: write
      pull-requests: write

  testing:
    uses: ./.github/workflows/testing.yml
    with:
      working_directory: ${{ inputs.working_directory }}
      python_version: ${{ inputs.python_version }}
      enable_secrets: ${{ inputs.enable_secrets }}
      run_tests: ${{ inputs.run_tests }}

  version:
    if: inputs.enable_versioning
    uses: ./.github/workflows/version.yml
    needs: [testing]
    with:
      working_directory: ${{ inputs.working_directory }}

  build-deb:
    runs-on: ubuntu-latest
    # Build inside an actual Debian container so the venv is built against the same
    # apt-provided /usr/bin/python3 that `depends: python3 (>= X.Y)` guarantees on
    # the real install target - a GitHub-hosted Python (setup-python, or uv's own
    # managed download) lives at a path no .deb dependency can promise exists there.
    container: debian:bookworm-slim
    timeout-minutes: 10
    needs: [version]
    if: github.ref == 'refs/heads/main' && (needs.version.outputs.new_release_published == 'true' || needs.version.outputs.new_release_published == true)
    permissions:
      contents: read
    defaults:
      run:
        working-directory: ${{ inputs.working_directory }}
    steps:
      - uses: actions/checkout@v7
      - name: Install build tooling
        run: |
          apt-get update
          apt-get install -y --no-install-recommends curl ca-certificates python3 python3-venv
      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Build a venv against the system Python
        run: |
          uv venv --relocatable --no-managed-python .venv
          uv sync --locked --no-dev --no-editable
      - name: Install nfpm
        run: |
          curl -sL https://github.com/goreleaser/nfpm/releases/latest/download/nfpm_amd64.deb -o nfpm.deb
          apt-get install -y ./nfpm.deb
          rm nfpm.deb
      - name: Build .deb package
        run: python3 packaging/build_deb.py
      - name: Upload .deb Artifact
        uses: actions/upload-artifact@v7
        with:
          name: debian-package
          path: ${{ inputs.working_directory }}/*.deb
