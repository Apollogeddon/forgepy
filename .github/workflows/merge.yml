name: merge

# Dependabot's pull requests: a review request, then a squash merge once the checks pass.

on:
  workflow_call:
    inputs:
      runs_on:
        description: "Runner label for every job, e.g. a self-hosted scale set's"
        required: false
        type: string
        default: 'ubuntu-latest'
      reviewers:
        description: "Comma-separated logins to request a review from; empty means the repository's owner, when that's a user"
        required: false
        type: string
        default: ''
      checks_passed:
        description: "Whether the pull request's checks passed in this run; the squash waits for them"
        required: false
        type: boolean
        default: false

jobs:
  # CODEOWNERS only requests reviews in a private repository on a paid plan, so Dependabot's pull
  # requests ask for one here instead, on any plan, and whether the checks passed or not
  review:
    name: review
    if: github.event_name == 'pull_request' && github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ${{ inputs.runs_on }}
    timeout-minutes: 5
    permissions:
      pull-requests: write
    steps:
      - name: Request a review
        uses: actions/github-script@v9
        env:
          PULL_REQUEST: ''
          REVIEWERS: ${{ inputs.reviewers }}
        with:
          script: |
            const number = Number(process.env.PULL_REQUEST || context.payload.pull_request?.number);
            if (!number) return core.notice('No pull request to request a review on');
            let reviewers = process.env.REVIEWERS.split(',').map((login) => login.trim()).filter(Boolean);
            if (reviewers.length === 0) {
              // an organisation can't be requested, and names its reviewers through the input instead
              const { data: repo } = await github.rest.repos.get(context.repo);
              if (repo.owner.type !== 'User') return core.notice('The owner is an organisation; set reviewers to request one');
              reviewers = [repo.owner.login];
            }
            // a review request is a courtesy, never a check: a failure here mustn't fail the pipeline
            try {
              await github.rest.pulls.requestReviewers({ ...context.repo, pull_number: number, reviewers });
              core.info(`Requested a review from ${reviewers.join(', ')} on #${number}`);
            } catch (error) {
              core.warning(`Couldn't request a review on #${number}: ${error.message}`);
            }

  squash:
    name: squash
    runs-on: ${{ inputs.runs_on }}
    timeout-minutes: 15
    # Dependabot opened the pull request and made its latest change, and the checks passed. Not for GitHub
    # Actions updates: they change workflow files, which GITHUB_TOKEN may never merge, so a person merges them
    if: inputs.checks_passed && github.event.pull_request.user.login == 'dependabot[bot]' && github.actor == 'dependabot[bot]' && !startsWith(github.head_ref, 'dependabot/github_actions/')
    permissions:
      contents: write
      pull-requests: write
    steps:
      # Through the API rather than the gh CLI, which a self-hosted runner may not have
      - name: Enable auto-merge
        uses: actions/github-script@v9
        env:
          DISPATCH_TYPE: auto-merged
        with:
          script: |
            const pr = context.payload.pull_request;
            // A merge made with GITHUB_TOKEN starts no workflow, so main's pipeline (and release-please)
            // would never see it. repository_dispatch is one of the two events that token may start.
            const dispatch = async () => {
              try {
                await github.rest.repos.createDispatchEvent({
                  ...context.repo,
                  event_type: process.env.DISPATCH_TYPE,
                  client_payload: { pull_request: pr.number },
                });
                core.info(`Sent ${process.env.DISPATCH_TYPE}, which runs a workflow listening for it on ${pr.base.ref}`);
              } catch (error) {
                core.warning(`Couldn't send ${process.env.DISPATCH_TYPE}, so main's pipeline won't run for #${pr.number}: ${error.message}`);
              }
            };
            // Auto-merge merges once the remaining required checks pass, so wait a while for it
            const dispatchOnceMerged = async () => {
              for (let wait = 0; wait < 12 * 60; wait += 20) {
                await new Promise((resolve) => setTimeout(resolve, 20_000));
                const { data } = await github.rest.pulls.get({ ...context.repo, pull_number: pr.number }).catch(() => ({ data: {} }));
                if (data.merged) return dispatch();
                if (data.state === 'closed') return core.info(`#${pr.number} was closed without merging`);
              }
              core.warning(`#${pr.number} hadn't merged after 12 minutes, so main's pipeline won't run for it until the next push`);
            };
            let merged = false;
            try {
              await github.graphql(
                `mutation ($id: ID!) {
                  enablePullRequestAutoMerge(input: { pullRequestId: $id, mergeMethod: SQUASH }) { clientMutationId }
                }`,
                { id: pr.node_id },
              );
              core.info(`Auto-merge enabled for #${pr.number}`);
            } catch (error) {
              // GitHub won't enable auto-merge on a PR it could merge now: one whose checks all
              // passed (clean) or that only waits on checks it doesn't require (unstable), or on
              // any PR to a branch with no protection rules, as nothing would hold it back. Nor
              // where the plan doesn't offer auto-merge, as on a free account's private repository.
              // Merge it now instead, as gh pr merge --auto does; this job runs after the checks
              // passed, so no check is skipped
              const mergeable =
                /is in (clean|unstable|has[ _]hooks) status|protected branch rules not configured|auto merge is not allowed/i;
              if (!mergeable.test(error.message)) throw error;
              await github.rest.pulls.merge({ ...context.repo, pull_number: pr.number, merge_method: 'squash' });
              core.info(`Merged #${pr.number}`);
              merged = true;
            }
            await (merged ? dispatch() : dispatchOnceMerged());
