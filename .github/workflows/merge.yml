name: Auto Merge

on:
  workflow_call:
    inputs:
      runs_on:
        description: "Runner label for every job, e.g. a self-hosted scale set's"
        required: false
        type: string
        default: 'ubuntu-latest'

jobs:
  auto-merge:
    runs-on: ${{ inputs.runs_on }}
    timeout-minutes: 10
    if: github.actor == 'dependabot[bot]'
    permissions:
      contents: write
      pull-requests: write
    steps:
      # Through the API rather than the gh CLI, which a self-hosted runner may not have
      - name: Enable auto-merge for Dependabot PRs
        uses: actions/github-script@v9
        with:
          script: |
            const pr = context.payload.pull_request;
            try {
              await github.graphql(
                `mutation ($id: ID!) {
                  enablePullRequestAutoMerge(input: { pullRequestId: $id, mergeMethod: MERGE }) { clientMutationId }
                }`,
                { id: pr.node_id },
              );
              core.info(`Auto-merge enabled for #${pr.number}`);
            } catch (error) {
              // GitHub won't enable auto-merge on a PR with nothing left to wait for;
              // merge it now instead, as gh pr merge --auto does
              if (!/clean status/i.test(error.message)) throw error;
              await github.rest.pulls.merge({ ...context.repo, pull_number: pr.number, merge_method: 'merge' });
              core.info(`Merged #${pr.number}`);
            }
