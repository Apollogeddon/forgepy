name: Python Tests

on:
  workflow_call:
    inputs:
      runs_on:
        description: "Runner label for every job, e.g. a self-hosted scale set's"
        required: false
        type: string
        default: 'ubuntu-latest'
      working_directory:
        required: false
        type: string
        default: '.'
      python_version:
        required: false
        type: string
        default: '3.13'
      enable_secrets:
        required: false
        type: boolean
        default: true
      run_tests:
        required: false
        type: boolean
        default: true
      auto_patch:
        description: "On main, upgrade packages with known vulnerabilities in uv.lock and commit the result"
        required: false
        type: boolean
        default: true
      artifact_name:
        required: false
        type: string
        default: 'dist'
      build_command:
        required: false
        type: string
        default: 'uv build'

jobs:
  quality:
    uses: ./.github/workflows/quality.yml
    with:
      runs_on: ${{ inputs.runs_on }}
      working_directory: ${{ inputs.working_directory }}
      python_version: ${{ inputs.python_version }}
      enable_secrets: ${{ inputs.enable_secrets }}

  testing:
    runs-on: ${{ inputs.runs_on }}
    if: inputs.run_tests
    timeout-minutes: 10
    needs: [quality]
    defaults:
      run:
        working-directory: ${{ inputs.working_directory }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ inputs.python_version }}
      - name: Install dependencies
        run: uv sync --locked
      - name: Tests
        run: uv run pytest
      - name: Upload Coverage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-${{ inputs.artifact_name }}
          path: |
            ${{ inputs.working_directory }}/htmlcov
            ${{ inputs.working_directory }}/junit-report.xml
          if-no-files-found: ignore

  build:
    runs-on: ${{ inputs.runs_on }}
    timeout-minutes: 10
    # only needs the checks to pass, so it runs alongside the tests
    needs: [quality]
    defaults:
      run:
        working-directory: ${{ inputs.working_directory }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ inputs.python_version }}
      - name: Install dependencies
        run: uv sync --locked
      - name: Build
        run: ${{ inputs.build_command }}
      - name: Upload Build Artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.artifact_name }}
          path: ${{ inputs.working_directory }}/dist

  patch:
    if: ${{ !failure() && !cancelled() && inputs.auto_patch && github.ref == 'refs/heads/main' }}
    needs: [quality, testing, build]
    runs-on: ${{ inputs.runs_on }}
    timeout-minutes: 10
    permissions:
      contents: write
    defaults:
      run:
        working-directory: ${{ inputs.working_directory }}
    steps:
      # keeps the token in .git/config, as this job pushes the patch commit
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          # no dependency cache in a job that pushes to main
          enable-cache: false
      # osv-scanner can't fix uv.lock in place, so it finds the vulnerable packages and uv upgrades
      # just those, transitive ones included, within the ranges pyproject.toml already allows
      - name: Upgrade vulnerable packages
        run: |
          curl -sSL https://github.com/google/osv-scanner/releases/latest/download/osv-scanner_linux_amd64 -o "$RUNNER_TEMP/osv-scanner"
          chmod +x "$RUNNER_TEMP/osv-scanner"
          # 1: vulnerabilities found; 128: nothing to scan besides the project itself; anything else fails the job
          status=0
          "$RUNNER_TEMP/osv-scanner" scan source -L uv.lock --format json --output-file "$RUNNER_TEMP/osv.json" || status=$?
          if [ "$status" -eq 128 ]; then exit 0; fi
          if [ "$status" -gt 1 ]; then exit "$status"; fi
          mapfile -t packages < <(jq -r '[.results[]?.packages[]? | select(.package.ecosystem == "PyPI") | .package.name | ascii_downcase | gsub("[-_.]+"; "-")] | unique[]' "$RUNNER_TEMP/osv.json")
          if [ "${#packages[@]}" -eq 0 ]; then exit 0; fi
          args=()
          for package in "${packages[@]}"; do args+=(--upgrade-package "$package"); done
          # --no-build: resolve from published metadata only, so no package's build code runs in this job
          uv lock --no-build "${args[@]}"
      - name: Commit Security Patches
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: "fix(deps): upgrade packages with known vulnerabilities via osv-scanner"
          file_pattern: 'uv.lock'
