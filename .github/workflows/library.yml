name: Python Library

on:
  workflow_call:
    inputs:
      enable_secrets:
        required: false
        type: boolean
        default: true
      python_version:
        required: false
        type: string
        default: '3.13'
      working_directory:
        required: false
        type: string
        default: '.'
      artifact_name:
        required: false
        type: string
        default: 'dist'
      publish:
        required: false
        type: boolean
        default: true

jobs:
  testing:
    uses: ./.github/workflows/testing.yml
    with:
      working_directory: ${{ inputs.working_directory }}
      python_version: ${{ inputs.python_version }}
      enable_secrets: ${{ inputs.enable_secrets }}
      artifact_name: ${{ inputs.artifact_name }}

  auto-merge:
    uses: ./.github/workflows/merge.yml
    needs: [testing]
    permissions:
      contents: write
      pull-requests: write

  version:
    uses: ./.github/workflows/version.yml
    needs: [testing]
    with:
      working_directory: ${{ inputs.working_directory }}
