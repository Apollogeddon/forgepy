name: Python Library

on:
  workflow_call:
    inputs:
      runs_on:
        description: "Runner label for every job, e.g. a self-hosted scale set's"
        required: false
        type: string
        default: 'ubuntu-latest'
      test_on_push:
        description: "Run the checks on pushes too; false runs them on pull requests (and scheduled runs) only"
        required: false
        type: boolean
        default: true
      test_release_prs:
        description: "Run the checks on release-please's release pull requests"
        required: false
        type: boolean
        default: true
      enable_secrets:
        required: false
        type: boolean
        default: true
      auto_patch:
        description: "On main, upgrade packages with known vulnerabilities in uv.lock and commit the result"
        required: false
        type: boolean
        default: true
      python_version:
        required: false
        type: string
        default: '3.13'
      working_directory:
        required: false
        type: string
        default: '.'
      run_tests:
        required: false
        type: boolean
        default: true
      enable_versioning:
        required: false
        type: boolean
        default: true
      artifact_name:
        required: false
        type: string
        default: 'dist'
      publish:
        required: false
        type: boolean
        default: true

jobs:
  testing:
    # With test_on_push false, a push checks only when a release is made, in release-testing.
    if: >-
      (github.event_name != 'push' || inputs.test_on_push) &&
      (inputs.test_release_prs || !startsWith(github.head_ref, 'release-please--'))
    uses: ./.github/workflows/testing.yml
    with:
      runs_on: ${{ inputs.runs_on }}
      working_directory: ${{ inputs.working_directory }}
      python_version: ${{ inputs.python_version }}
      enable_secrets: ${{ inputs.enable_secrets }}
      auto_patch: ${{ inputs.auto_patch }}
      run_tests: ${{ inputs.run_tests }}
      artifact_name: ${{ inputs.artifact_name }}

  auto-merge:
    uses: ./.github/workflows/merge.yml
    with:
      runs_on: ${{ inputs.runs_on }}
    needs: [testing]
    permissions:
      contents: write
      pull-requests: write

  version:
    # Runs when the checks were skipped, as on a push to main with test_on_push false, but not when they failed.
    if: ${{ !failure() && !cancelled() && inputs.enable_versioning }}
    uses: ./.github/workflows/version.yml
    needs: [testing]
    with:
      runs_on: ${{ inputs.runs_on }}
      working_directory: ${{ inputs.working_directory }}

  release-testing:
    # With test_on_push false, a push to main is checked and built only when release-please made a release.
    needs: [version]
    if: >-
      !cancelled() && github.event_name == 'push' && !inputs.test_on_push &&
      (needs.version.outputs.new_release_published == 'true' || needs.version.outputs.new_release_published == true)
    uses: ./.github/workflows/testing.yml
    with:
      runs_on: ${{ inputs.runs_on }}
      working_directory: ${{ inputs.working_directory }}
      python_version: ${{ inputs.python_version }}
      enable_secrets: ${{ inputs.enable_secrets }}
      auto_patch: ${{ inputs.auto_patch }}
      run_tests: ${{ inputs.run_tests }}
      artifact_name: ${{ inputs.artifact_name }}

  publish:
    runs-on: ${{ inputs.runs_on }}
    timeout-minutes: 10
    needs: [testing, version, release-testing]
    if: ${{ !failure() && !cancelled() && (needs.testing.result == 'success' || needs['release-testing'].result == 'success') && inputs.publish && github.ref == 'refs/heads/main' && (needs.version.outputs.new_release_published == 'true' || needs.version.outputs.new_release_published == true) }}
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: ${{ inputs.working_directory }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          name: ${{ inputs.artifact_name }}
          path: ${{ inputs.working_directory }}/dist
      - uses: astral-sh/setup-uv@v7
      # Publishes via PyPI Trusted Publishing (OIDC) - no token needed.
      # Configure the trusted publisher on the PyPI project settings page first.
      - name: Publish to PyPI
        run: uv publish
