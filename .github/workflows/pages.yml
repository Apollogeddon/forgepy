name: pages

# Deploys a built website, the artifact website.yml uploaded earlier in the run, to GitHub Pages.

on:
  workflow_call:
    inputs:
      runs_on:
        description: "Runner label for every job, e.g. a self-hosted scale set's"
        required: false
        type: string
        default: 'ubuntu-latest'
      artifact_name:
        description: "The build artifact to deploy, as website.yml's artifact_name"
        required: false
        type: string
        default: 'dist'

# nothing by default: every job asks for what it needs
permissions: {}

jobs:
  deploy:
    name: deploy
    runs-on: ${{ inputs.runs_on }}
    timeout-minutes: 10
    # one deploy at a time, and a waiting one is replaced by a newer one rather than overtaking a running
    # one; not named pages, which a caller copying GitHub's starter workflow uses, as a shared group deadlocks
    concurrency:
      group: pages-deploy
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Download the build
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ inputs.artifact_name }}
          path: ./pages-artifact
      - name: Upload the Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ./pages-artifact
      - name: Deploy to Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1