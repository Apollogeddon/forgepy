name: website

# A website's checks: lint, scan, test, build, then check the built site. pages.yml deploys it.

on:
  workflow_call:
    inputs:
      runs_on:
        description: "Runner label for every job, e.g. a self-hosted scale set's"
        required: false
        type: string
        default: 'ubuntu-latest'
      working_directory:
        description: "Directory holding pyproject.toml"
        required: false
        type: string
        default: '.'
      python_version:
        description: "Python version; empty reads the project's .python-version, else Python 3.13"
        required: false
        type: string
        default: ''
      enable_secrets:
        description: "Scan for secrets with Gitleaks"
        required: false
        type: boolean
        default: true
      run_tests:
        description: "Run the test suite; init --no-testing sets it to false"
        required: false
        type: boolean
        default: true
      sync_args:
        description: "Extra arguments for uv sync, e.g. --group to pick a dependency group"
        required: false
        type: string
        default: ''
      build_command:
        description: "The command that builds the site into working_directory/dist"
        required: false
        type: string
        default: 'uv run zensical build'
      artifact_name:
        description: "The build artifact's name, which the check stage and pages.yml download"
        required: false
        type: string
        default: 'dist'
      ref:
        description: "Commit, branch or tag to check out; empty means the commit that triggered the run"
        required: false
        type: string
        default: ''
      pre_build_command:
        description: "Shell command run in working_directory before installing dependencies, in every job that does; GH_TOKEN holds the GH_TOKEN secret if passed"
        required: false
        type: string
        default: ''
      base_path:
        description: "The path the site is served under, e.g. /my-repo/ for a GitHub Pages project site, so the site checks resolve root-relative links; empty means /"
        required: false
        type: string
        default: ''
      check_links:
        description: "Check the built site's links with lychee; internal links only unless check_external_links"
        required: false
        type: boolean
        default: false
      check_external_links:
        description: "With check_links, check links to other sites too"
        required: false
        type: boolean
        default: false
      link_check_args:
        description: "Extra lychee arguments, e.g. --include-fragments or --exclude <pattern>"
        required: false
        type: string
        default: ''
      check_accessibility:
        description: "Check the built site against WCAG 2.2 A and AA with axe, in a headless Chromium"
        required: false
        type: boolean
        default: false
      accessibility_paths:
        description: "Comma- or newline-separated pages to check, relative to base_path; empty checks every page in the sitemap, else the home page"
        required: false
        type: string
        default: ''
      accessibility_impact:
        description: "The lowest axe impact that fails the check (minor, moderate, serious or critical); lower ones are reported as warnings"
        required: false
        type: string
        default: 'serious'
    secrets:
      GH_TOKEN:
        description: "A token pre_build_command can use, as GH_TOKEN"
        required: false

jobs:
  lint:
    name: lint
    runs-on: ${{ inputs.runs_on }}
    timeout-minutes: 10
    permissions:
      contents: read
    defaults:
      run:
        working-directory: ${{ inputs.working_directory }}
    steps:
      - name: Check out
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      # the input if set, else the project's .python-version, else forgepy's default
      - name: Resolve the Python version
        id: python
        env:
          INPUT: ${{ inputs.python_version }}
        run: |
          if [ -n "$INPUT" ]; then version="$INPUT"
          elif [ -f .python-version ]; then version=$(tr -d '[:space:]' < .python-version)
          else version=3.13
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ steps.python.outputs.version }}
      # generates what the install, checks or build need, e.g. content made by another tool
      - name: Run the pre-build command
        if: inputs.pre_build_command != ''
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          PRE_BUILD_COMMAND: ${{ inputs.pre_build_command }}
        run: bash -e -c "$PRE_BUILD_COMMAND"
      - name: Install dependencies
        env:
          SYNC_ARGS: ${{ inputs.sync_args }}
        run: |
          # unquoted on purpose: it can hold several arguments
          # shellcheck disable=SC2086
          uv sync --locked $SYNC_ARGS
      - name: Lint
        run: uv run ruff check .
      - name: Check formatting
        run: uv run ruff format --check .
      - name: Check types
        run: uv run basedpyright
      # a --jython project's scripts must stay valid Jython 2.7
      - name: Check Jython 2.7 compatibility
        if: hashFiles(format('{0}/.forgepy/ruff-jython.toml', inputs.working_directory)) != ''
        run: uv run poe compat
      - name: Check forgepy's configs
        if: hashFiles(format('{0}/.forgepy/**', inputs.working_directory)) != ''
        run: uv run forgepy sync --check

  scan:
    name: scan
    runs-on: ${{ inputs.runs_on }}
    timeout-minutes: 10
    permissions:
      contents: read
      # Gitleaks comments on the pull request it finds a secret in
      pull-requests: write
    defaults:
      run:
        working-directory: ${{ inputs.working_directory }}
    steps:
      - name: Check out
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
          fetch-depth: 0
      - name: Scan with Gitleaks
        if: inputs.enable_secrets
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # A high or critical finding (CVSS 7 or more) fails a pull request; elsewhere it's annotated
      # instead, so releases and the patch pipeline that fixes it still run. Accept one with an
      # IgnoredVulns entry in an osv-scanner.toml beside the lockfile
      - name: Scan with OSV
        id: osv
        run: |
          curl -sL https://github.com/google/osv-scanner/releases/latest/download/osv-scanner_linux_amd64 -o "$RUNNER_TEMP/osv-scanner"
          chmod +x "$RUNNER_TEMP/osv-scanner"
          # 0: nothing found, 1: vulnerabilities found, 128: no lockfile, anything else: no scan
          status=0
          "$RUNNER_TEMP/osv-scanner" scan source -r --format json --output-file "$RUNNER_TEMP/osv.json" . || status=$?
          echo "status=$status" >> "$GITHUB_OUTPUT"
          rm "$RUNNER_TEMP/osv-scanner"
      - name: Report OSV findings
        uses: actions/github-script@v9
        env:
          OSV_STATUS: ${{ steps.osv.outputs.status }}
          OSV_REPORT: ${{ runner.temp }}/osv.json
          OSV_ENFORCE: ${{ github.event_name == 'pull_request' }}
        with:
          script: |
            const fs = require('node:fs');
            const path = require('node:path');
            const status = Number(process.env.OSV_STATUS);
            if (status === 128) {
              core.info('No lockfiles to scan');
              return;
            }
            if ((status !== 0 && status !== 1) || !fs.existsSync(process.env.OSV_REPORT)) {
              core.warning(`OSV-Scanner couldn't finish (exit ${status}), so dependencies weren't checked; see the scan step's log`, { title: 'OSV scan incomplete' });
              return;
            }
            const report = JSON.parse(fs.readFileSync(process.env.OSV_REPORT, 'utf8'));
            // a GitHub advisory's rating when an advisory has no CVSS score
            const ratings = { CRITICAL: 9, HIGH: 7, MODERATE: 4, MEDIUM: 4, LOW: 1 };
            const rows = [];
            let blocking = 0;
            for (const result of report.results ?? []) {
              const file = path.relative(process.env.GITHUB_WORKSPACE, result.source.path);
              for (const { package: pkg, vulnerabilities = [], groups = [] } of result.packages ?? []) {
                for (const group of groups) {
                  const vulns = vulnerabilities.filter((v) => group.ids.includes(v.id));
                  let score = Number.parseFloat(group.max_severity);
                  if (Number.isNaN(score)) {
                    score = Math.max(0, ...vulns.map((v) => ratings[String(v.database_specific?.severity).toUpperCase()] ?? 0));
                  }
                  const high = score >= 7;
                  const message = `${pkg.name} ${pkg.version}: ${group.ids.join(', ')} ${vulns[0]?.summary ?? ''} (severity ${score || 'unknown'})`;
                  if (high) {
                    blocking++;
                    core.error(message, { title: 'High or critical vulnerability', file });
                  } else {
                    core.warning(message, { title: 'Vulnerability', file });
                  }
                  rows.push([file, `${pkg.name} ${pkg.version}`, group.ids.join(', '), String(score || 'unknown')]);
                }
              }
            }
            if (rows.length) {
              await core.summary
                .addHeading('OSV-Scanner findings', 3)
                .addTable([['Lockfile', 'Package', 'Advisories', 'Severity'], ...rows])
                .write();
            }
            const found = `${blocking} high or critical ${blocking === 1 ? 'vulnerability' : 'vulnerabilities'}`;
            if (blocking && process.env.OSV_ENFORCE === 'true') {
              core.setFailed(`${found}: update the packages, or record an accepted one in osv-scanner.toml`);
            } else if (blocking) {
              core.warning(`${found}: this fails pull requests until they're updated, as the patch pipeline may do`, { title: 'OSV scan' });
            } else {
              core.info(`${rows.length} found, none high or critical`);
            }

  test:
    name: test
    if: inputs.run_tests
    needs: [lint, scan]
    runs-on: ${{ inputs.runs_on }}
    timeout-minutes: 10
    permissions:
      contents: read
    defaults:
      run:
        working-directory: ${{ inputs.working_directory }}
    steps:
      - name: Check out
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      # the input if set, else the project's .python-version, else forgepy's default
      - name: Resolve the Python version
        id: python
        env:
          INPUT: ${{ inputs.python_version }}
        run: |
          if [ -n "$INPUT" ]; then version="$INPUT"
          elif [ -f .python-version ]; then version=$(tr -d '[:space:]' < .python-version)
          else version=3.13
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ steps.python.outputs.version }}
      # generates what the install, checks or build need, e.g. content made by another tool
      - name: Run the pre-build command
        if: inputs.pre_build_command != ''
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          PRE_BUILD_COMMAND: ${{ inputs.pre_build_command }}
        run: bash -e -c "$PRE_BUILD_COMMAND"
      - name: Install dependencies
        env:
          SYNC_ARGS: ${{ inputs.sync_args }}
        run: |
          # unquoted on purpose: it can hold several arguments
          # shellcheck disable=SC2086
          uv sync --locked $SYNC_ARGS
      - name: Test
        run: uv run pytest
      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-${{ inputs.artifact_name }}
          path: |
            ${{ inputs.working_directory }}/htmlcov
            ${{ inputs.working_directory }}/junit-report.xml
          if-no-files-found: ignore

  build:
    name: build
    # only needs the lint and scan to pass, so it runs alongside the tests
    needs: [lint, scan]
    runs-on: ${{ inputs.runs_on }}
    timeout-minutes: 10
    permissions:
      contents: read
    defaults:
      run:
        working-directory: ${{ inputs.working_directory }}
    steps:
      - name: Check out
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      # the input if set, else the project's .python-version, else forgepy's default
      - name: Resolve the Python version
        id: python
        env:
          INPUT: ${{ inputs.python_version }}
        run: |
          if [ -n "$INPUT" ]; then version="$INPUT"
          elif [ -f .python-version ]; then version=$(tr -d '[:space:]' < .python-version)
          else version=3.13
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ steps.python.outputs.version }}
      # generates what the install, checks or build need, e.g. content made by another tool
      - name: Run the pre-build command
        if: inputs.pre_build_command != ''
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          PRE_BUILD_COMMAND: ${{ inputs.pre_build_command }}
        run: bash -e -c "$PRE_BUILD_COMMAND"
      - name: Install dependencies
        env:
          SYNC_ARGS: ${{ inputs.sync_args }}
        run: |
          # unquoted on purpose: it can hold several arguments
          # shellcheck disable=SC2086
          uv sync --locked $SYNC_ARGS
      - name: Build
        env:
          BUILD_COMMAND: ${{ inputs.build_command }}
        run: bash -e -c "$BUILD_COMMAND"
      - name: Upload the build
        uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.artifact_name }}
          path: ${{ inputs.working_directory }}/dist

  # checks the uploaded build, so a failing check leaves the build to inspect
  check:
    name: check
    if: inputs.check_links || inputs.check_accessibility
    needs: [build]
    runs-on: ${{ inputs.runs_on }}
    # installing a browser and visiting every page takes longer than a build
    timeout-minutes: ${{ inputs.check_accessibility && 20 || 10 }}
    permissions:
      contents: read
    steps:
      - name: Download the build
        uses: actions/download-artifact@v8
        with:
          name: ${{ inputs.artifact_name }}
          path: ${{ runner.temp }}/forgepy-site
      # served from a copy under the base path, as the host serves it, so root-relative links resolve;
      # links to the site's own address, as site_url makes them, are checked in the copy too
      - name: Stage the site for checking
        id: site
        env:
          BASE_PATH: ${{ inputs.base_path }}
          BUILD: ${{ runner.temp }}/forgepy-site
        run: |
          # with site_url set, the build links to the site's own address; its sitemap says what that is
          origin=''
          if [ -f "$BUILD/sitemap.xml" ]; then
            origin=$(grep -o '<loc>[^<]*</loc>' "$BUILD/sitemap.xml" | head -n1 | sed -n 's#^<loc>[[:space:]]*\(https\{0,1\}://[^/<]*\).*#\1#p')
          fi
          base="/${BASE_PATH#/}"
          base="${base%/}/"
          root="$RUNNER_TEMP/site"
          rm -rf "$root"
          mkdir -p "$root$base"
          cp -R "$BUILD/." "$root$base"
          remap=''
          if [ -n "$origin" ]; then
            remap="--remap '^${origin//./\\.}/ file://$root/'"
          fi
          {
            echo "root=$root"
            echo "base=$base"
            echo "remap=$remap"
          } >> "$GITHUB_OUTPUT"
      # only for the project's lychee.toml or .lycheeignore, which lychee reads from where it runs
      - name: Check out
        if: inputs.check_links
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      # offline by default, so another site being down never fails the check; reads a lychee.toml or
      # .lycheeignore in working_directory
      - name: Check links
        if: inputs.check_links
        uses: lycheeverse/lychee-action@v2
        with:
          workingDirectory: ${{ inputs.working_directory }}
          args: >-
            --no-progress
            ${{ !inputs.check_external_links && '--offline' || '' }}
            --root-dir '${{ steps.site.outputs.root }}'
            --fallback-extensions html
            --index-files index.html
            ${{ steps.site.outputs.remap }}
            ${{ inputs.link_check_args }}
            '${{ steps.site.outputs.root }}/**/*.html'
          output: ${{ runner.temp }}/lychee/out.md
          fail: true
          failIfEmpty: false
          jobSummary: true
      - name: Set up Node
        uses: actions/setup-node@v7
        if: ${{ !cancelled() && inputs.check_accessibility && steps.site.outcome == 'success' }}
        with:
          node-version: lts/*
      # outside the project, so its lockfile and node_modules stay as they are
      - name: Install the accessibility checker
        if: ${{ !cancelled() && inputs.check_accessibility && steps.site.outcome == 'success' }}
        working-directory: ${{ runner.temp }}
        run: |
          mkdir -p a11y
          cd a11y
          printf '{"private":true,"type":"module"}' > package.json
          npm install --ignore-scripts --no-audit --no-fund --save-exact playwright@1.63.0 @axe-core/playwright@4.13.0
          # the browser's system libraries need root to install; a runner without sudo must have them already
          if sudo -n true 2>/dev/null; then
            npx playwright install --with-deps --only-shell chromium
          else
            npx playwright install --only-shell chromium
          fi
          cat > check.mjs <<'EOF'
          import fs from "node:fs";
          import http from "node:http";
          import path from "node:path";
          import AxeBuilder from "@axe-core/playwright";
          import { chromium } from "playwright";

          const root = process.env.SITE_ROOT;
          const base = process.env.BASE_PATH;
          const levels = ["minor", "moderate", "serious", "critical"];
          const threshold = levels.indexOf(process.env.IMPACT || "serious");
          if (threshold < 0) throw new Error(`accessibility_impact must be one of ${levels.join(", ")}`);

          const types = { ".html": "text/html", ".css": "text/css", ".js": "text/javascript", ".mjs": "text/javascript",
            ".json": "application/json", ".svg": "image/svg+xml", ".png": "image/png", ".jpg": "image/jpeg",
            ".jpeg": "image/jpeg", ".gif": "image/gif", ".webp": "image/webp", ".avif": "image/avif", ".ico": "image/x-icon",
            ".woff": "font/woff", ".woff2": "font/woff2", ".xml": "application/xml", ".txt": "text/plain" };

          // the file a URL path serves, as a static host would: a directory's index.html, or the path plus .html
          const resolve = (urlPath) => {
            const file = path.join(root, decodeURIComponent(urlPath));
            if (!file.startsWith(root + path.sep)) return undefined;
            for (const candidate of [file, path.join(file, "index.html"), `${file}.html`]) {
              if (fs.statSync(candidate, { throwIfNoEntry: false })?.isFile()) return candidate;
            }
          };

          const server = http.createServer((req, res) => {
            const file = resolve(new URL(req.url, "http://localhost").pathname);
            if (!file) return res.writeHead(404).end("Not found");
            res.writeHead(200, { "content-type": types[path.extname(file)] ?? "application/octet-stream" });
            fs.createReadStream(file).pipe(res);
          });
          await new Promise((done) => server.listen(0, "127.0.0.1", done));
          const origin = `http://127.0.0.1:${server.address().port}`;

          // the listed paths, relative to the base path; without any, every page in the sitemap, else the home page
          const sitemap = (file, seen = new Set()) => {
            if (seen.has(file) || !fs.existsSync(file)) return [];
            seen.add(file);
            const locs = [...fs.readFileSync(file, "utf8").matchAll(/<loc>\s*([^<\s]+)\s*<\/loc>/g)].map((m) => new URL(m[1]).pathname);
            return locs.flatMap((loc) => (loc.endsWith(".xml") ? sitemap(path.join(root, loc), seen) : [loc]));
          };
          const listed = (process.env.PAGES ?? "").split(/[\n,]/).map((p) => p.trim()).filter(Boolean);
          let pages = listed.map((p) => base + p.replace(/^\//, ""));
          if (pages.length === 0) {
            const site = path.join(root, base);
            const found = ["sitemap-index.xml", "sitemap.xml"].map((name) => path.join(site, name)).find(fs.existsSync);
            // a site built without site_url writes a sitemap that lists no pages
            pages = found ? [...new Set(sitemap(found))] : [];
            console.log(pages.length ? `Checking ${pages.length} pages from ${path.relative(root, found)}` : "No pages in a sitemap, checking the home page");
            if (pages.length === 0) pages = [base];
          }

          const failures = [];
          const notes = [];
          const browser = await chromium.launch();
          try {
            const page = await (await browser.newContext()).newPage();
            for (const pagePath of pages) {
              const response = await page.goto(origin + pagePath, { waitUntil: "load" });
              if (!response?.ok()) {
                failures.push({ page: pagePath, rule: "page", impact: "critical", help: `HTTP ${response?.status()}`, nodes: [] });
                continue;
              }
              const { violations } = await new AxeBuilder({ page })
                .withTags(["wcag2a", "wcag2aa", "wcag21a", "wcag21aa", "wcag22aa"])
                .analyze();
              for (const v of violations) {
                const entry = { page: pagePath, rule: v.id, impact: v.impact, help: v.help, url: v.helpUrl, nodes: v.nodes.map((n) => n.target.join(" ")) };
                (levels.indexOf(v.impact) >= threshold ? failures : notes).push(entry);
              }
            }
          } finally {
            await browser.close();
            server.close();
          }

          const report = (entry, kind) => {
            const where = entry.nodes.slice(0, 5).join(", ") + (entry.nodes.length > 5 ? `, and ${entry.nodes.length - 5} more` : "");
            console.log(`::${kind} title=${entry.rule} (${entry.impact}) on ${entry.page}::${entry.help}${where ? `: ${where}` : ""}${entry.url ? ` ${entry.url}` : ""}`);
          };
          for (const entry of notes) report(entry, "warning");
          for (const entry of failures) report(entry, "error");

          const cell = (text) => String(text).replaceAll("|", "\\|").replaceAll("\n", " ");
          const rows = [...failures, ...notes].map((e) =>
            `| ${cell(e.page)} | ${e.url ? `[${e.rule}](${e.url})` : e.rule} | ${e.impact} | ${cell(e.help)} | ${e.nodes.length} |`);
          const summary = [
            "## Accessibility",
            "",
            `${pages.length} ${pages.length === 1 ? "page" : "pages"} checked against WCAG 2.2 A and AA: ${failures.length} violations at ${levels[threshold]} impact or above, ${notes.length} below it.`,
            "",
            ...(rows.length ? ["| Page | Rule | Impact | Problem | Elements |", "| :--- | :--- | :--- | :--- | ---: |", ...rows] : []),
          ].join("\n");
          if (process.env.GITHUB_STEP_SUMMARY) fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, `${summary}\n`);
          console.log(summary);
          process.exitCode = failures.length > 0 ? 1 : 0;
          EOF
      - name: Check accessibility
        if: ${{ !cancelled() && inputs.check_accessibility && steps.site.outcome == 'success' }}
        env:
          SITE_ROOT: ${{ steps.site.outputs.root }}
          BASE_PATH: ${{ steps.site.outputs.base }}
          PAGES: ${{ inputs.accessibility_paths }}
          IMPACT: ${{ inputs.accessibility_impact }}
        run: node "$RUNNER_TEMP/a11y/check.mjs"
