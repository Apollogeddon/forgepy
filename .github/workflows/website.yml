name: Python Website

on:
  workflow_call:
    inputs:
      enable_secrets:
        required: false
        type: boolean
        default: true
      python_version:
        required: false
        type: string
        default: '3.13'
      working_directory:
        required: false
        type: string
        default: '.'
      artifact_name:
        required: false
        type: string
        default: 'dist'
      build_command:
        required: false
        type: string
        default: 'uv run zensical build'
      run_tests:
        required: false
        type: boolean
        default: true
      enable_versioning:
        required: false
        type: boolean
        default: true
      auto_merge:
        required: false
        type: boolean
        default: true
      docker:
        required: false
        type: boolean
        default: false
      docker_platforms:
        required: false
        type: string
        default: 'linux/amd64,linux/arm64'
      docker_native_arm:
        required: false
        type: boolean
        default: true

jobs:
  testing:
    uses: ./.github/workflows/testing.yml
    with:
      working_directory: ${{ inputs.working_directory }}
      python_version: ${{ inputs.python_version }}
      enable_secrets: ${{ inputs.enable_secrets }}
      artifact_name: ${{ inputs.artifact_name }}
      build_command: ${{ inputs.build_command }}
      run_tests: ${{ inputs.run_tests }}

  auto-merge:
    uses: ./.github/workflows/merge.yml
    needs: [testing, docker]
    # docker is skipped when disabled, and a plain `needs` on a skipped job would skip auto-merge too
    if: ${{ !cancelled() && inputs.auto_merge && needs.testing.result == 'success' && (needs.docker.result == 'success' || needs.docker.result == 'skipped') }}
    permissions:
      contents: write
      pull-requests: write

  version:
    if: inputs.enable_versioning
    uses: ./.github/workflows/version.yml
    needs: [testing]
    with:
      working_directory: ${{ inputs.working_directory }}

  docker:
    needs: [testing, version]
    # !cancelled() so a skipped version job (PRs, enable_versioning: false) doesn't skip the build
    if: ${{ !cancelled() && inputs.docker && needs.testing.result == 'success' && (needs.version.result == 'success' || needs.version.result == 'skipped') }}
    uses: ./.github/workflows/docker.yml
    with:
      working_directory: ${{ inputs.working_directory }}
      platforms: ${{ inputs.docker_platforms }}
      native_arm: ${{ inputs.docker_native_arm }}
      push: ${{ github.ref == 'refs/heads/main' && needs.version.outputs.new_release_published == 'true' }}
      version: ${{ needs.version.outputs.version }}

  deploy:
    runs-on: ubuntu-latest
    needs: [testing, version]
    # always() so a skipped version job (enable_versioning: false) doesn't skip the deploy
    if: |
      always() &&
      github.ref == 'refs/heads/main' &&
      needs.testing.result == 'success' &&
      (needs.version.result == 'success' || needs.version.result == 'skipped') &&
      (!inputs.enable_versioning || needs.version.outputs.new_release_published == 'true' || needs.version.outputs.new_release_published == true)
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v7
        with:
          name: ${{ inputs.artifact_name }}
          path: ./pages-artifact
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./pages-artifact
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
