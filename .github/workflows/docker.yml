name: docker

# Builds a multi-platform image and, on a release, pushes it to GitHub Container Registry.

on:
  workflow_call:
    inputs:
      runs_on:
        description: "Runner label for the remote BuildKit build; the other builds need GitHub's runners"
        required: false
        type: string
        default: 'ubuntu-latest'
      platforms:
        description: "Comma-separated target platforms, e.g. linux/amd64,linux/arm64,linux/arm/v7"
        required: false
        type: string
        default: 'linux/amd64,linux/arm64'
      push:
        description: "Push to the registry; otherwise build only (validates the Dockerfile on PRs)"
        required: false
        type: boolean
        default: false
      version:
        description: "Release version used for semver tags"
        required: false
        type: string
        default: ''
      image:
        description: "Image name; defaults to ghcr.io/<owner>/<repo>"
        required: false
        type: string
        default: ''
      working_directory:
        description: "Directory holding the Dockerfile"
        required: false
        type: string
        default: '.'
      native_arm:
        description: "Build linux/arm64 on GitHub's native Arm runners instead of QEMU"
        required: false
        type: boolean
        default: true
      buildkit_endpoint:
        description: "A remote BuildKit (e.g. tcp://runner.builder:1234) that builds every platform in one job on runs_on, emulating the ones it can't run natively, and pushes the tagged image itself"
        required: false
        type: string
        default: ''

# nothing by default: every job asks for what it needs
permissions: {}

jobs:
  # Every platform but a native arm64 one, in one build: amd64 natively and the rest with QEMU, or all of them on
  # the remote BuildKit. Pushed images go up untagged by digest, and push tags the combined manifest.
  build:
    name: build
    # QEMU and buildx's default driver need a Docker daemon, which self-hosted runners don't have
    runs-on: ${{ inputs.buildkit_endpoint != '' && inputs.runs_on || 'ubuntu-latest' }}
    # emulated platforms build several times slower than native ones
    timeout-minutes: ${{ inputs.buildkit_endpoint != '' && 120 || 60 }}
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Resolve the image and platforms
        id: plan
        env:
          IMAGE: ${{ inputs.image }}
          REPOSITORY: ${{ github.repository }}
          PLATFORMS: ${{ inputs.platforms }}
          NATIVE_ARM: ${{ inputs.native_arm }}
          ENDPOINT: ${{ inputs.buildkit_endpoint }}
        run: |
          image="${IMAGE:-ghcr.io/$REPOSITORY}"
          # GHCR rejects uppercase repository names
          echo "image=${image,,}" >> "$GITHUB_OUTPUT"
          IFS=, read -ra requested <<< "${PLATFORMS//[[:space:]]/}"
          platforms=()
          for platform in "${requested[@]}"; do
            [ -n "$platform" ] || continue
            # build (arm64) builds it on a native Arm runner
            if [ "$platform" = linux/arm64 ] && [ "$NATIVE_ARM" = true ] && [ -z "$ENDPOINT" ]; then continue; fi
            platforms+=("$platform")
          done
          echo "platforms=$(IFS=,; echo "${platforms[*]}")" >> "$GITHUB_OUTPUT"
          emulate=false
          for platform in "${platforms[@]}"; do [ "$platform" = linux/amd64 ] || emulate=true; done
          echo "emulate=$emulate" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        if: inputs.buildkit_endpoint == '' && steps.plan.outputs.emulate == 'true'
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - name: Set up Buildx
        if: inputs.buildkit_endpoint == '' && steps.plan.outputs.platforms != ''
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Log in to GHCR
        if: inputs.buildkit_endpoint == '' && inputs.push && steps.plan.outputs.platforms != ''
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build
        id: build
        if: inputs.buildkit_endpoint == '' && steps.plan.outputs.platforms != ''
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ inputs.working_directory }}
          platforms: ${{ steps.plan.outputs.platforms }}
          cache-from: type=gha,scope=docker-build
          cache-to: type=gha,mode=max,scope=docker-build
          outputs: ${{ inputs.push && format('type=image,name={0},push-by-digest=true,name-canonical=true,push=true', steps.plan.outputs.image) || 'type=cacheonly' }}
          provenance: ${{ inputs.push && 'mode=max' || 'false' }}
          sbom: ${{ inputs.push }}
      - name: Export the digest
        if: inputs.buildkit_endpoint == '' && inputs.push && steps.plan.outputs.platforms != ''
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p "$RUNNER_TEMP/digests"
          touch "$RUNNER_TEMP/digests/${DIGEST#sha256:}"
      - name: Upload the digest
        if: inputs.buildkit_endpoint == '' && inputs.push && steps.plan.outputs.platforms != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: docker-digest-build
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

      # There's no Docker daemon for docker login, so write the credentials buildx reads instead.
      - name: Write the registry credentials
        if: inputs.buildkit_endpoint != '' && inputs.push
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
        run: |
          mkdir -p ~/.docker
          printf '{"auths":{"ghcr.io":{"auth":"%s"}}}' "$(printf '%s:%s' "$ACTOR" "$TOKEN" | base64 -w0)" > ~/.docker/config.json
      - name: Use the remote BuildKit
        if: inputs.buildkit_endpoint != ''
        env:
          ENDPOINT: ${{ inputs.buildkit_endpoint }}
        run: docker buildx create --name forgepy --driver remote "$ENDPOINT" --use
      - name: Compute the tags
        if: inputs.buildkit_endpoint != '' && inputs.push
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ steps.plan.outputs.image }}
          tags: |
            type=semver,pattern={{version}},value=${{ inputs.version }}
            type=semver,pattern={{major}}.{{minor}},value=${{ inputs.version }}
            type=semver,pattern={{major}},value=${{ inputs.version }},enable=${{ !startsWith(inputs.version, '0.') }}
            type=sha
            type=raw,value=latest
      # A shared BuildKit's cache could hold layers another repository's job planted, so pushed images build without it.
      - name: Build on the remote BuildKit
        if: inputs.buildkit_endpoint != ''
        working-directory: ${{ inputs.working_directory }}
        env:
          PLATFORMS: ${{ steps.plan.outputs.platforms }}
          PUSH: ${{ inputs.push }}
        run: |
          args=(--platform "$PLATFORMS")
          if [ "$PUSH" = "true" ]; then
            mapfile -t tags < <(jq -r '.tags[]' <<< "$DOCKER_METADATA_OUTPUT_JSON")
            for tag in "${tags[@]}"; do args+=(--tag "$tag"); done
            args+=(--push --no-cache --provenance mode=max --sbom true)
          else
            args+=(--output type=cacheonly)
          fi
          docker buildx build "${args[@]}" .
      - name: Inspect the image
        if: inputs.buildkit_endpoint != '' && inputs.push
        env:
          IMAGE: ${{ steps.plan.outputs.image }}
          VERSION: ${{ steps.meta.outputs.version }}
        run: docker buildx imagetools inspect "$IMAGE:$VERSION"
      - name: Forget the credentials
        if: always() && inputs.buildkit_endpoint != ''
        run: |
          rm -f ~/.docker/config.json
          docker buildx rm forgepy || true

  build-arm64:
    name: build (arm64)
    if: inputs.buildkit_endpoint == '' && inputs.native_arm && contains(inputs.platforms, 'linux/arm64')
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Resolve the image
        id: plan
        env:
          IMAGE: ${{ inputs.image }}
          REPOSITORY: ${{ github.repository }}
          PLATFORMS: ${{ inputs.platforms }}
        run: |
          image="${IMAGE:-ghcr.io/$REPOSITORY}"
          echo "image=${image,,}" >> "$GITHUB_OUTPUT"
          # contains() also matched a longer name, such as linux/arm64/v8
          IFS=, read -ra requested <<< "${PLATFORMS//[[:space:]]/}"
          wanted=false
          for platform in "${requested[@]}"; do [ "$platform" != linux/arm64 ] || wanted=true; done
          echo "wanted=$wanted" >> "$GITHUB_OUTPUT"
      - name: Set up Buildx
        if: steps.plan.outputs.wanted == 'true'
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Log in to GHCR
        if: steps.plan.outputs.wanted == 'true' && inputs.push
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build
        id: build
        if: steps.plan.outputs.wanted == 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ inputs.working_directory }}
          platforms: linux/arm64
          cache-from: type=gha,scope=docker-build-arm64
          cache-to: type=gha,mode=max,scope=docker-build-arm64
          outputs: ${{ inputs.push && format('type=image,name={0},push-by-digest=true,name-canonical=true,push=true', steps.plan.outputs.image) || 'type=cacheonly' }}
          provenance: ${{ inputs.push && 'mode=max' || 'false' }}
          sbom: ${{ inputs.push }}
      - name: Export the digest
        if: steps.plan.outputs.wanted == 'true' && inputs.push
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p "$RUNNER_TEMP/digests"
          touch "$RUNNER_TEMP/digests/${DIGEST#sha256:}"
      - name: Upload the digest
        if: steps.plan.outputs.wanted == 'true' && inputs.push
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: docker-digest-arm64
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  # Tags one manifest holding every platform the builds pushed; the remote BuildKit build pushed its own.
  push:
    name: push
    needs: [build, build-arm64]
    if: >-
      !cancelled() && inputs.push && inputs.buildkit_endpoint == '' &&
      needs.build.result == 'success' && needs.build-arm64.result != 'failure'
    # Needs a Docker daemon (docker login, buildx's default driver), which self-hosted runners don't have.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      packages: write
    steps:
      - name: Resolve the image
        id: plan
        env:
          IMAGE: ${{ inputs.image }}
          REPOSITORY: ${{ github.repository }}
        run: |
          image="${IMAGE:-ghcr.io/$REPOSITORY}"
          echo "image=${image,,}" >> "$GITHUB_OUTPUT"
      - name: Download the digests
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: ${{ runner.temp }}/digests
          pattern: docker-digest-*
          merge-multiple: true
      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Compute the tags
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ steps.plan.outputs.image }}
          tags: |
            type=semver,pattern={{version}},value=${{ inputs.version }}
            type=semver,pattern={{major}}.{{minor}},value=${{ inputs.version }}
            type=semver,pattern={{major}},value=${{ inputs.version }},enable=${{ !startsWith(inputs.version, '0.') }}
            type=sha
            type=raw,value=latest
      # each digest is a pushed image or index; the combined manifest takes every platform in them
      - name: Push to GHCR
        working-directory: ${{ runner.temp }}/digests
        env:
          IMAGE: ${{ steps.plan.outputs.image }}
        run: |
          mapfile -t tags < <(jq -r '.tags[]' <<< "$DOCKER_METADATA_OUTPUT_JSON")
          args=()
          for tag in "${tags[@]}"; do args+=(-t "$tag"); done
          for digest in *; do args+=("$IMAGE@sha256:$digest"); done
          docker buildx imagetools create "${args[@]}"
      - name: Inspect the image
        env:
          IMAGE: ${{ steps.plan.outputs.image }}
          VERSION: ${{ steps.meta.outputs.version }}
        run: docker buildx imagetools inspect "$IMAGE:$VERSION"
