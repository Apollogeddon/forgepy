name: patch

# Weekly: refreshes the files forgepy manages and proposes the refresh as a pull request. Vulnerable
# dependencies are left to Dependabot security updates, which propose their upgrades as pull requests too.

on:
  workflow_call:
    inputs:
      runs_on:
        description: "Runner label for every job, e.g. a self-hosted scale set's"
        required: false
        type: string
        default: 'ubuntu-latest'
      working_directory:
        description: "Directory holding pyproject.toml and uv.lock"
        required: false
        type: string
        default: '.'

# No permissions of its own: the job takes its caller's grant, so a caller that grants contents: write but not
# pull-requests: write still starts (GitHub refuses a whole run whose called job asks for more), and only the
# pull request step warns.

jobs:
  update:
    name: update
    if: github.ref == 'refs/heads/main'
    runs-on: ${{ inputs.runs_on }}
    timeout-minutes: 10
    defaults:
      run:
        working-directory: ${{ inputs.working_directory }}
    steps:
      # no credentials kept: only the push gets the token, so sync and the tools it runs never see it
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up uv
        uses: astral-sh/setup-uv@18d369b23da25a81e9458561248e1aafff6a70fa # v10.3.1
        with:
          # no dependency cache in a job that pushes
          enable-cache: false
      # a project moved to a new forgepy tag without running sync gets the files it manages refreshed here
      - name: Refresh forgepy's files
        if: hashFiles(format('{0}/.forgepy/**', inputs.working_directory)) != ''
        run: uv run --locked forgepy sync
      # one branch per directory, replaced by each refresh, so there's never more than one pull request for it
      - name: Push the refresh
        id: push
        if: hashFiles(format('{0}/.forgepy/**', inputs.working_directory)) != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH: ${{ inputs.working_directory == '.' && 'forgepy/sync' || format('forgepy/sync-{0}', inputs.working_directory) }}
        run: |
          if [ -z "$(git status --porcelain -- .forgepy)" ]; then
            echo "Nothing to refresh"
            exit 0
          fi
          git add -- .forgepy
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            commit -q -m "chore(deps): refresh the files forgepy manages"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)" \
            push --force origin "HEAD:refs/heads/$BRANCH"
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"
      # Through the API rather than the gh CLI, which a self-hosted runner may not have
      - name: Propose the refresh
        if: steps.push.outputs.branch != ''
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          BRANCH: ${{ steps.push.outputs.branch }}
          BASE: ${{ github.ref_name }}
          DIRECTORY: ${{ inputs.working_directory }}
        with:
          script: |
            const head = process.env.BRANCH;
            const { data: open } = await github.rest.pulls.list({
              ...context.repo,
              state: 'open',
              head: `${context.repo.owner}:${head}`,
            });
            if (open.length) return core.info(`#${open[0].number} already proposes ${head}, which now holds this refresh`);
            const where = process.env.DIRECTORY === '.' ? '' : ` in ${process.env.DIRECTORY}`;
            try {
              const { data: pr } = await github.rest.pulls.create({
                ...context.repo,
                head,
                base: process.env.BASE,
                title: `chore(deps): refresh the files forgepy manages${where}`,
                body: [
                  `\`forgepy sync\` refreshed \`.forgepy/\`${where} to match the forgepy release the project uses.`,
                  '',
                  // a pull request opened with GITHUB_TOKEN starts no workflow run
                  'Its checks only run once the branch gets a push from someone else, or the pull request is closed and reopened.',
                ].join('\n'),
              });
              core.info(`Opened #${pr.number}`);
            } catch (error) {
              // a caller generated before patch opened pull requests grants contents: write alone
              if (error.status !== 403) throw error;
              core.warning(`Pushed ${head}, but couldn't open a pull request for it: grant this job pull-requests: write in .index.yml, or open one from the branch`);
            }
