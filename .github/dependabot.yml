version: 2
updates:
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    # Limit open PRs to prevent flooding
    open-pull-requests-limit: 10
    # Group non-major updates to reduce PR volume
    groups:
      dependencies:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    # Ensure commit messages follow your convention (e.g., 'chore(deps): ...')
    commit-message:
      prefix: "fix(deps)"
    # Wait 3 days after a version is published before proposing it, so a
    # compromised release has time to be caught/yanked upstream first.
    cooldown:
      default-days: 3

  # The documentation site is its own uv project
  - package-ecosystem: "uv"
    directory: "/docs"
    schedule:
      interval: "weekly"
    groups:
      docs:
        patterns:
          - "*"
    commit-message:
      prefix: "chore(docs)"
    cooldown:
      default-days: 3

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      actions:
        patterns:
          - "*"
    commit-message:
      prefix: "chore(ci)"
    ignore:
      - dependency-name: "apollogeddon/forgepy"
    cooldown:
      default-days: 3
