name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  # sent by the auto-merge job, as a merge it makes starts no push run on main
  repository_dispatch:
    types: [auto-merged]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # never cancel a run on main mid-release, or the release is created but never published
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  library:
    uses: apollogeddon/forgepy/.github/workflows/library.yml@main
    permissions:
      contents: write
      pull-requests: write
      # PyPI trusted publishing (OIDC)
      id-token: write
    with:
      auto_patch: true
