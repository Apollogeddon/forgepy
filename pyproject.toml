[project]
name = "forgepy"
version = "0.7.0"
description = "Reusable GitHub Actions workflows and tooling configurations for Python projects"
readme = "README.md"
authors = [
    { name = "Apollogeddon" }
]
license = "MIT"
keywords = ["scaffolding", "cli", "project-generator", "ruff", "uv", "ci-cd"]
requires-python = ">=3.11"
dependencies = [
    "tomlkit>=0.13",
]

[project.urls]
Homepage = "https://github.com/apollogeddon/forgepy"
Repository = "https://github.com/apollogeddon/forgepy"
Issues = "https://github.com/apollogeddon/forgepy/issues"

[project.optional-dependencies]
toolchain = [
    "ruff>=0.14",
    "basedpyright>=1.31",
    "pytest>=9.0",
    "pytest-cov>=7.0",
    "poethepoet>=0.38",
    "pre-commit>=4.3",
    "commitizen>=4.9",
    "watchdog>=6.0",
    "validate-pyproject>=0.24",
]

[project.scripts]
forgepy = "forgepy.cli:main"

[project.entry-points.pytest11]
forgepy = "forgepy.pytest_plugin"

[dependency-groups]
dev = [
    "forgepy[toolchain]",
    "pyyaml>=6.0",
]

[build-system]
requires = ["uv_build>=0.7,<0.13"]
build-backend = "uv_build"

[tool.uv.sources]
forgepy = { workspace = true }

[tool.uv.workspace]
members = ["."]
# docs/ is the documentation site's own uv project, not a workspace member
exclude = ["docs"]

[tool.commitizen]
name = "cz_conventional_commits"
tag_format = "v$version"

[tool.poe.tasks]
lint = { shell = "ruff check --fix . && ruff format ." }
format = "ruff format ."
type = "basedpyright"
test = "pytest"
"test:unit" = { shell = "pytest -q --no-cov -m 'not slow'" }
security = "osv-scanner scan -r ."
hooks = "pre-commit install"
build = "uv build"
