[project]
name = "forgepy"
version = "0.1.0"
description = "Quality control tool for maintaining best practice Python projects"
readme = "README.md"
authors = [
    { name = "Apollogeddon", email = "dunc1221@proton.me" }
]
requires-python = ">=3.11"
dependencies = [
    "tomlkit>=0.13",
]

[project.optional-dependencies]
toolchain = [
    "ruff>=0.14",
    "basedpyright>=1.31",
    "pytest>=9.0",
    "pytest-cov>=7.0",
    "poethepoet>=0.38",
    "pre-commit>=4.3",
    "commitizen>=4.9",
    "watchdog>=6.0",
    "validate-pyproject>=0.24",
]

[project.scripts]
forgepy = "forgepy.cli:main"

[project.entry-points.pytest11]
forgepy = "forgepy.pytest_plugin"

[dependency-groups]
dev = [
    "forgepy[toolchain]",
    "pyyaml>=6.0",
]

[build-system]
requires = ["uv_build>=0.7,<0.9"]
build-backend = "uv_build"

[tool.uv.sources]
forgepy = { workspace = true }

[tool.uv.workspace]
members = ["."]

[tool.poe.tasks]
lint = { shell = "ruff check --fix . && ruff format ." }
format = "ruff format ."
type = "basedpyright"
test = "pytest"
test-fast = { shell = "pytest -m 'not slow'" }
security = "osv-scanner scan -r ."
hooks = "pre-commit install"
build = "uv build"
